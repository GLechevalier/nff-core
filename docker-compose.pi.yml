# nff-pentester on a Raspberry Pi (Ubuntu/Pi OS, 64-bit).
#
#   docker compose -f docker-compose.pi.yml up -d --build
#
# Host networking is deliberate: an IoT scanner must see the real LAN subnet so
# nmap / discover_devices enumerate the actual network, not a bridge. With
# network_mode: host the container binds 3006 directly on the Pi — no port map.
#
# Fill in .env first (cp .env.example .env). Supabase service-role vars are
# REQUIRED — the server refuses to boot without a reachable Supabase.

services:
  nff-pentester:
    build:
      context: .
      dockerfile: Dockerfile.full
    image: nff-pentester:full
    container_name: nff-pentester
    restart: unless-stopped
    env_file: .env
    # Host LAN visibility for nmap/discovery + reachable on :3006 from your laptop.
    network_mode: host
    # nmap raw-socket scans + BLE radio need these.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # ble_scan: bleak -> BlueZ over the host's system DBus. Drop these two
    # volumes (and the host's bluetooth service) if you don't need BLE.
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/lib/bluetooth:/var/lib/bluetooth
    # Firmware analysis: mount a host dir of firmware images to analyze.
    # - ./firmware:/firmware:ro
