[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nff-mock-core"
version = "0.1.0"
description = "Shared contract/identity layer for nff mock devices (all complexity levels)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nff_mock_core"]
