[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nff-mock-targets"
version = "0.1.0"
description = "Deliberately-vulnerable IoT targets for safely demonstrating nff-pentester"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# SSH (asyncssh) and CoAP (aiocoap) services. The telnet/HTTP/MQTT/firmware
# surfaces all work on base deps; SSH + CoAP light Chain 4-ssh and Chain 7.
insecure = [
    "asyncssh>=2.14",
    "aiocoap>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiomqtt>=2.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
nff-mock-esp32 = "nff_mock_targets.esp32.cli:main"
nff-mock-linux = "nff_mock_targets.linux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nff_mock_targets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
