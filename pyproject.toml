[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nff"
version = "0.2.36"
description = "Claude Code IoT Bridge — connect Claude to hardware via USB"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gauthier Lechevalier", email = "gauthier.lechevalier26@gmail.com" }]
requires-python = ">=3.10"
keywords = ["arduino", "esp32", "mcp", "claude", "iot", "serial", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
# No runtime dependencies: the wheel ships the self-contained Rust binary
# (maturin bindings = "bin"); the `nff` command is that binary, not Python.

[project.urls]
Homepage = "https://github.com/GLechevalier/nff"
Repository = "https://github.com/GLechevalier/nff"
"Bug Tracker" = "https://github.com/GLechevalier/nff/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "black",
    "ruff",
    # On-chip debug bridge (nff/nff/tools/debug.py) drives GDB via the MI protocol.
    "pygdbmi>=0.11",
    # Runtime libraries the Python *reference* package imports. The shipped wheel is the
    # self-contained Rust binary and needs NO runtime deps, but importing/pytest-ing the
    # reference modules under `nff/` does — without these, `pip install -e .[dev]` + pytest
    # aborts at collection (ModuleNotFoundError) in a clean environment like CI.
    "click",         # CLI framework (nff/nff/cli.py and every command)
    "requests",      # HTTP client (auth, installer, agent, provisioning)
    "pyserial",      # `import serial` — board enumeration + serial I/O
    "rich",          # styled terminal output (compile/flash/power/agent)
    "mcp",           # MCP SDK — the reference MCP server (nff/nff/mcp_server.py)
    "httpx",         # used by the MCP transport tests (tests/test_mcp.py)
    "uvicorn",       # ASGI server hosting the reference MCP server
    "starlette",     # ASGI types used by the reference MCP server
]

[tool.maturin]
# Build the Rust binary from nff-rs/ and package it as the `nff` command. The wheel
# is platform-specific and contains only the compiled binary — no Python package.
bindings = "bin"
manifest-path = "nff-rs/nff/Cargo.toml"
# The reference Python package lives at ./nff, which maturin auto-detects (it matches the
# project name) and would bundle. Exclude it so the wheel ships ONLY the binary — the
# in-repo Python stays a dev/reference artifact, not shipped.
exclude = ["nff/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
