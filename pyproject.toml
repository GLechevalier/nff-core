[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nff-fleet"
version = "0.1.7"
description = "IoT fleet management microservice — MQTT broker + MCP server for Claude"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "amqtt>=0.11",
    "cryptography>=42.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "uvicorn>=0.30",
    "aiofiles>=23.0",
    "supabase>=2.0",
    "httpx>=0.27",
]

[project.scripts]
nff-fleet = "nff_fleet.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["nff_fleet"]
