[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nff-pentester"
version = "0.1.0"
description = "MCP server — automated IoT device pentesting via Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.24.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "asyncssh>=2.14",
    "bleak>=0.21",
    "aiomqtt>=2.0",
    "aiocoap>=0.4",
    "python-dotenv>=1.1",
    "supabase>=2.0",
]

[project.scripts]
nff-pentester = "nff_pentester.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.hatchling.build]
packages = ["nff_pentester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
