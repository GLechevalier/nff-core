[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nff-mock-controller"
version = "0.1.13"
description = "On-demand orchestrator that spawns/provisions/reaps nff-mock virtual ESP32s"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nff-mock-core",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
nff-mock-controller = "nff_mock_controller.server:main"

# nff-mock-core is a sibling path package in this monorepo (../core). The Docker image
# installs it explicitly before this package; uv resolves it from here for local dev.
[tool.uv.sources]
nff-mock-core = { path = "../core", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["nff_mock_controller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
