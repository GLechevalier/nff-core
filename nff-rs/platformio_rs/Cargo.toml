[package]
name = "platformio_rs"
version = "0.1.0"
edition = "2021"
description = "Native-Rust reimplementation of PlatformIO Core, driven by nff."

# Library: consumed in-process by the `nff` crate.
[lib]
name = "platformio_rs"
path = "src/lib.rs"

# Binary: `pio-rs`, a drop-in CLI used by the differential parity harness so the
# vendored PlatformIO pytest suite can drive it exactly like the Python `pio`.
[[bin]]
name = "pio-rs"
path = "src/bin/pio_rs.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
regex      = "1"
glob       = "0.3"
sha1       = "0.10"
dirs       = "5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Archive reading/writing for the manifest archive sniff (M2b) and the packer.
tar        = "0.4"
flate2     = "1"
# Archive extraction + checksum verification for downloads (M2c).
zip        = { version = "2", default-features = false, features = ["deflate"] }
sha2       = "0.10"
md-5       = "0.10"
# HTTP client for the registry + package downloads (M2c networked layer).
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Serial-port enumeration for `device list` (M3).
serialport = "4"
# base64 (urlsafe) for the SCons argument encoding contract (M4).
base64     = "0.22"
# Parallel native compile fan-out for the ESP32 fast-path (M6b).
rayon      = "1"

[dev-dependencies]
tempfile = "3"
